elovital:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: 480

spring:
  application:
    name: elovital-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/public.pem

  flyway:
    enabled: true

server:
  port: ${PORT:8080}