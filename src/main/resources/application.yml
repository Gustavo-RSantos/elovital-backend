elovital:
  jwt:
    secret: ${ELOVITAL_JWT_SECRET}
    expiracao-minutos: 480

spring:
  application:
    name: elovital-backend

  datasource:
    url: ${ELOVITAL_URL_DATABASE}
    username:  ${ELOVITAL_DATABASE_USERNAME}
    password:  ${ELOVITAL__DATABASE_PASSWORD}

  jpa:
    open-in-view: false        # evita consultas "escondidas" na camada de controller
    hibernate:
      ddl-auto: update       # o schema é criado pelo Flyway; o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver: { jwt: { public-key-location: classpath:certs/public.pem } }
  flyway:
    enabled: true

server:
  port: 8080
